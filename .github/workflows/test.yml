name: webhook ingestion system 

on:
  push:
    branches:
      -main
  pull_request:
    branches:
      -main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: webhook_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d webhook_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:latest
        ports:
          - 6379:6379

    env:
      NODE_ENV: test

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: webhook_test_db
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

      REDIS_HOST: localhost
      REDIS_PORT: 6379

      WEBHOOK_SECRET: ${{ secrets.TEST_WEBHOOK_SECRET }}
      WEBHOOK_TOLERANCE_SECONDS: 300

      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      JWT_EXPIRES_IN: 1h

      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run migrate

      - name: Run tests
        run: npm test      

     