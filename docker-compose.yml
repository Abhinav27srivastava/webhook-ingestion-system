

services:

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: webhook-app

    env_file:
      - .env

    ports:
      - "5000:5000"

    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    build: .
    container_name: webhook-worker
    command: npm run worker

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  test:
    build: 
      context: .
      dockerfile: Dockerfile.test

    container_name: webhook-test
    
    env_file:
      - .env

    environment:
      NODE_ENV: test
      DB_HOST: postgres
      DB_NAME: webhook_test_db
      REDIS_HOST: redis

    command: "npm test"

    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
  test-worker:
    build: .
    container_name: webhook-test-worker

    env_file:
      - .env

    environment:
      NODE_ENV: test
      DB_HOST: postgres
      DB_NAME: webhook_test_db
      REDIS_HOST: redis
      REDIS_PORT: 6379

    command: npm run worker

    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy  
volumes:
  postgres-data: